name: reusable-service-pipeline

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string          # e.g. "orders-service"
      service_dir:
        required: true
        type: string           # e.g. "orders-service"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service_dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ${{ inputs.service_dir }}/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check
        env:
          JWT_SIGNING_KEY: test-key
          INTERNAL_SERVICE_TOKEN: test-token

      - name: Run tests
        run: python manage.py test
        env:
          JWT_SIGNING_KEY: test-key
          INTERNAL_SERVICE_TOKEN: test-token

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "tag=$(echo $GITHUB_SHA | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.service_dir }}
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.service_name }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=${{ inputs.service_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service_name }}

      # Fail the build on HIGH/CRITICAL vulnerabilities before anything is
      # ever pushed -- this is the DevSecOps gate carried over from the
      # earlier pipeline project.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ inputs.service_name }}:${{ steps.vars.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.service_dir }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.service_name }}:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ inputs.service_name }}:latest
          cache-from: type=gha,scope=${{ inputs.service_name }}

      - name: Sign image (cosign, keyless OIDC)
        uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/${{ inputs.service_name }}@${{ steps.vars.outputs.tag }}
        env:
          COSIGN_EXPERIMENTAL: "1"

    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}

  update-manifest:
    needs: build-scan-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Bump image tag for ArgoCD (GitOps)
        run: |
          cd k8s/overlays/production
          sed -i "s#name: ghcr.io/YOUR_ORG/${{ inputs.service_name }}.*#name: ghcr.io/${{ github.repository_owner }}/${{ inputs.service_name }}#" kustomization.yaml
          python3 - << 'PY'
          import re
          path = "kustomization.yaml"
          content = open(path).read()
          pattern = re.compile(
              r'(- name: ghcr\.io/[^\s]*${{ inputs.service_name }}\n\s*newTag: )\S+'
          )
          content = pattern.sub(r'\g<1>${{ needs.build-scan-push.outputs.image_tag }}', content)
          open(path, "w").write(content)
          PY

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/production/kustomization.yaml
          git diff --cached --quiet || git commit -m "ci: bump ${{ inputs.service_name }} to ${{ needs.build-scan-push.outputs.image_tag }}"
          git push
