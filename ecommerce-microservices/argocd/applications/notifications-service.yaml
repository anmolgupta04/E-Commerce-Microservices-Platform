apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-notifications-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/ecommerce-microservices.git
    targetRevision: main
    path: k8s/services/notifications-service
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
