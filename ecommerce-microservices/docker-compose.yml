x-common-env: &common-env
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-change-me-shared-jwt-signing-key}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-internal-service-token}
  EVENT_BUS_MODE: amqp
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
  DB_ENGINE: django.db.backends.postgresql
  DB_USER: ${POSTGRES_USER:-ecommerce}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
  DB_HOST: postgres
  DB_PORT: 5432
  AUTH_SERVICE_URL: http://auth-service:8000
  CATALOG_SERVICE_URL: http://catalog-service:8000
  ORDERS_SERVICE_URL: http://orders-service:8000
  PAYMENTS_SERVICE_URL: http://payments-service:8000
  NOTIFICATIONS_SERVICE_URL: http://notifications-service:8000
  DEBUG: "False"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_MULTIPLE_DATABASES: auth_db,catalog_db,orders_db,payments_db,notifications_db
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI: guest/guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth-service
    environment:
      <<: *common-env
      DB_NAME: auth_db
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "8001:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  catalog-service:
    build: ./catalog-service
    environment:
      <<: *common-env
      DB_NAME: catalog_db
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "8002:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  orders-service:
    build: ./orders-service
    environment:
      <<: *common-env
      DB_NAME: orders_db
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      auth-service: { condition: service_started }
      catalog-service: { condition: service_started }
    ports:
      - "8003:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  payments-service:
    build: ./payments-service
    environment:
      <<: *common-env
      DB_NAME: payments_db
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    ports:
      - "8004:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  payments-consumer:
    build: ./payments-service
    environment:
      <<: *common-env
      DB_NAME: payments_db
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    command: python manage.py consume_events
    restart: unless-stopped

  notifications-service:
    build: ./notifications-service
    environment:
      <<: *common-env
      DB_NAME: notifications_db
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    ports:
      - "8005:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  notifications-consumer:
    build: ./notifications-service
    environment:
      <<: *common-env
      DB_NAME: notifications_db
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    command: python manage.py consume_events
    restart: unless-stopped

volumes:
  pgdata:
