apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
data:
  DEBUG: "False"
  DB_ENGINE: "django.db.backends.postgresql"
  DB_PORT: "5432"
  EVENT_BUS_MODE: "amqp"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq.ecommerce.svc.cluster.local:5672/%2F"
  # Cluster-internal DNS names -- ClusterIP Services below give every
  # service a stable hostname, so this is the K8s equivalent of the
  # AUTH_SERVICE_URL / CATALOG_SERVICE_URL env vars used in docker-compose.
  AUTH_SERVICE_URL: "http://auth-service.ecommerce.svc.cluster.local:8000"
  CATALOG_SERVICE_URL: "http://catalog-service.ecommerce.svc.cluster.local:8000"
  ORDERS_SERVICE_URL: "http://orders-service.ecommerce.svc.cluster.local:8000"
  PAYMENTS_SERVICE_URL: "http://payments-service.ecommerce.svc.cluster.local:8000"
  NOTIFICATIONS_SERVICE_URL: "http://notifications-service.ecommerce.svc.cluster.local:8000"
