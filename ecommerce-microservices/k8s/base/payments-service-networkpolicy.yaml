# Default-deny is applied cluster-wide by 99-networkpolicy-default-deny.yaml.
# This policy opens only what payments-service actually needs: inbound from any pod
# in the namespace (Orders/Payments calling it) plus the ingress
# controller, and DNS + RabbitMQ + Postgres egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payments-service-allow
  namespace: ecommerce
spec:
  podSelector:
    matchLabels:
      app: payments-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ecommerce
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - port: 8000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - port: 5672
    - ports:
        - port: 5432   # RDS is outside the cluster; egress to 0.0.0.0/0:5432 scoped by AWS SG in practice
    - to:
        - namespaceSelector: {}
      ports:
        - port: 8000   # inter-service REST calls
