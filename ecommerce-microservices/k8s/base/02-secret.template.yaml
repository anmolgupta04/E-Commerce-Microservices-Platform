# TEMPLATE ONLY -- do not commit a filled-in version of this file.
# In CI/CD this is rendered with real values from GitHub Actions secrets /
# AWS Secrets Manager (see .github/workflows/*-deploy.yml) or, better,
# replaced entirely with a SealedSecret / External Secrets Operator
# ExternalSecret pointing at Secrets Manager -- committing even an
# encrypted blob of DB creds is avoidable when the cluster can fetch them
# directly.
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  JWT_SIGNING_KEY: "REPLACE_ME"
  INTERNAL_SERVICE_TOKEN: "REPLACE_ME"
  DB_USER: "REPLACE_ME"
  DB_PASSWORD: "REPLACE_ME"
  # One RDS instance per service (see terraform/rds.tf) -- each service
  # only ever gets the host for its own database.
  AUTH_DB_HOST: "REPLACE_ME.rds.amazonaws.com"
  CATALOG_DB_HOST: "REPLACE_ME.rds.amazonaws.com"
  ORDERS_DB_HOST: "REPLACE_ME.rds.amazonaws.com"
  PAYMENTS_DB_HOST: "REPLACE_ME.rds.amazonaws.com"
  NOTIFICATIONS_DB_HOST: "REPLACE_ME.rds.amazonaws.com"
