apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-service-consumer
  namespace: ecommerce
  labels:
    app: payments-service-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-service-consumer
  template:
    metadata:
      labels:
        app: payments-service-consumer
    spec:
      containers:
        - name: payments-service-consumer
          image: ghcr.io/YOUR_ORG/payments-service:latest
          envFrom:
            - configMapRef:
                name: ecommerce-config
            - secretRef:
                name: ecommerce-secrets
          env:
            - name: DB_NAME
              value: "payments_db"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: PAYMENTS_DB_HOST
          command: ["python", "manage.py", "consume_events"]
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
